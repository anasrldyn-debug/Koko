
name: Extract SE Pool Free

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o SEPoolFree-source.zip -d extracted
          cp -R extracted/SEPoolFree/. .
          rm -rf extracted
          rm -f SEPoolFree-source.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract SE Pool Free project" || true
          git push
          
